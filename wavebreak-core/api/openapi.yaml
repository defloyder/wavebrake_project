openapi: 3.1.0
info:
  title: WAVEBREAK Core API
  version: 0.1.0
servers:
  - url: https://api.example.test
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: Service is alive
  /readyz:
    get:
      summary: Readiness probe
      responses:
        "200":
          description: Dependencies are ready
        "503":
          description: Dependency unavailable
  /v1/auth/register:
    post:
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered
  /v1/auth/login:
    post:
      summary: Login and issue token pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Token pair
  /v1/auth/email/login-code/request:
    post:
      summary: Mail a one-time sign-in code to an existing account (202 for unknown addresses too)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                language:
                  type: string
      responses:
        "202":
          description: Sent (or silently ignored for an unknown address)
        "429":
          description: A code was sent less than a minute ago, or too many attempts
  /v1/auth/email/login-code/confirm:
    post:
      summary: Sign in with the mailed code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                code:
                  type: string
      responses:
        "200":
          description: Token pair
        "400":
          description: invalid_code or code_expired
        "429":
          description: too_many_attempts
  /v1/auth/refresh:
    post:
      summary: Refresh an access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: New token pair
  /v1/auth/logout:
    post:
      summary: Revoke a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: Token revoked
  /v1/auth/password-reset/confirm:
    post:
      summary: Set a new password with a one-time reset token
      description: Public. The token (from the reset link) is single-use and expires (default 1h). All sessions of the user are revoked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 10
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [password_updated]
        "400":
          description: PASSWORD_RESET_TOKEN_INVALID (unknown, expired or used) or WEAK_PASSWORD
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
  /v1/me:
    get:
      security:
        - bearerAuth: []
      summary: Current user
      responses:
        "200":
          description: Current user claims
  /v1/client/bootstrap:
    get:
      security:
        - bearerAuth: []
      summary: Mobile/desktop bootstrap payload with user, overview, plans, and nodes
      responses:
        "200":
          description: Client bootstrap payload
  /v1/me/overview:
    get:
      security:
        - bearerAuth: []
      summary: Current account overview with subscription, usage, devices, telegram identities and access summary
      responses:
        "200":
          description: Account overview
  /v1/me/identities:
    get:
      security:
        - bearerAuth: []
      summary: List identities linked to the current account
      responses:
        "200":
          description: Identity list
  /v1/me/identities/telegram/link:
    post:
      security:
        - bearerAuth: []
      summary: Issue a one-time Telegram account link token
      responses:
        "201":
          description: Link token issued
  /v1/me/identities/telegram:
    delete:
      security:
        - bearerAuth: []
      summary: Unlink Telegram identity from the current account
      responses:
        "200":
          description: Telegram identity unlinked
  /v1/me/usage:
    get:
      security:
        - bearerAuth: []
      summary: Current subscription traffic usage
      responses:
        "200":
          description: Usage summary
  /v1/me/usage/history:
    get:
      security:
        - bearerAuth: []
      summary: Current subscription traffic usage history
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [7d, 30d, current]
      responses:
        "200":
          description: Usage history
  /v1/me/devices:
    get:
      security:
        - bearerAuth: []
      summary: List current user devices
      responses:
        "200":
          description: Device list
    post:
      security:
        - bearerAuth: []
      summary: Register a current user device while enforcing subscription device limits
      description: >-
        With install_id (the app's id of its installation, kept across
        sign-outs) an active device of this user with the same install_id is
        returned (200) instead of creating another one — signing in again
        never takes a new slot. A revoked device is not brought back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                platform:
                  type: string
                install_id:
                  type: string
                  maxLength: 128
      responses:
        "200":
          description: Existing device of this installation returned
        "201":
          description: Device created
        "403":
          description: DEVICE_LIMIT_REACHED
  /v1/me/devices/{deviceID}:
    patch:
      security:
        - bearerAuth: []
      summary: Update a device name or platform
      parameters:
        - name: deviceID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Device updated
    delete:
      security:
        - bearerAuth: []
      summary: Revoke a device
      parameters:
        - name: deviceID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Device revoked
  /v1/plans:
    get:
      summary: Active public plans
      description: >
        Each plan may carry an offer: original_price_minor (the price
        before the discount, shown struck through) and badge ("-17%").
      responses:
        "200":
          description: Plan list
  /v1/locations:
    get:
      security:
        - bearerAuth: []
      summary: List user-visible node locations
      responses:
        "200":
          description: Location list
  /v1/subscriptions:
    post:
      security:
        - bearerAuth: []
      summary: Activate a plan without payment (off unless WAVEBREAK_SELF_SERVE_SUBSCRIPTIONS)
      description: >
        Off by default: 402 PAYMENT_REQUIRED (choosing a plan does not grant
        it; access is issued by the administration until a payment step
        exists). When enabled: creates and activates the subscription
        (201). When the user's
        subscription is past_due (period over or traffic exhausted, within
        the grace period) it is renewed in place instead (200): same
        subscription and credential, so the subscription link keeps
        working; fresh period and plan terms, usage from zero, keys served
        to nodes again; audits subscription_renewed. An active one -> 409
        SUBSCRIPTION_ALREADY_ACTIVE.
      responses:
        "200":
          description: past_due subscription renewed
        "201":
          description: Subscription created
        "409":
          description: SUBSCRIPTION_ALREADY_ACTIVE
  /v1/promo-codes/check:
    post:
      security:
        - bearerAuth: []
      summary: Check a promo code for the signed-in user
      description: >
        Body {code, plan_id?}. Codes match case-insensitively, spaces
        ignored. 200 {code, description, discount_type (percent|fixed),
        discount_value, currency?, plan_id?, valid_until?, plans: [{plan_id,
        price_minor, discounted_price_minor, currency}]} for the public plans
        it applies to. Checking doesn't use up an activation (that happens at
        the payment step). Rate-limited per IP like login.
      responses:
        "200":
          description: The code applies; prices with the discount
        "422":
          description: >
            PROMO_NOT_FOUND, PROMO_INACTIVE, PROMO_NOT_STARTED, PROMO_EXPIRED,
            PROMO_EXHAUSTED, PROMO_ALREADY_USED, PROMO_NOT_FOR_PLAN or
            PROMO_CURRENCY_MISMATCH
  /v1/subscriptions/current:
    get:
      security:
        - bearerAuth: []
      summary: Current live subscription (past_due included)
      description: >
        For past_due the response also has grace_ends_at: until then the
        subscription can be renewed; VPN access is blocked meanwhile, and
        afterwards it expires and the account is reset (keys revoked,
        devices except the most recently active one revoked). Grace period:
        WAVEBREAK_SUBSCRIPTION_GRACE, default 168h.
      responses:
        "200":
          description: Subscription, plus grace_ends_at when past_due
        "404":
          description: No live subscription
  /v1/me/access:
    post:
      security:
        - bearerAuth: []
      summary: The caller's own VPN access (subscription credential and app links)
      description: >
        Returns the stable credential of the caller's subscription, issuing
        it first if the subscription has none. All devices of the account
        share it, so traffic is counted on the one subscription. links are
        standard share links in order of preference: VLESS REALITY (when
        published), VLESS Direct-TLS, Hysteria2.
      responses:
        "200":
          description: Access
          content:
            application/json:
              schema:
                type: object
                properties:
                  credential_id: {type: string, format: uuid}
                  subscription_url: {type: string}
                  config_status: {type: string, example: ready}
                  expires_at: {type: string, format: date-time}
                  links:
                    type: array
                    items: {type: string}
        "404":
          description: SUBSCRIPTION_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "422":
          description: SUBSCRIPTION_NOT_ACTIVE (past_due, suspended, period over)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
  /v1/nodes:
    get:
      security:
        - bearerAuth: []
      summary: List nodes
      responses:
        "200":
          description: Node list
  /v1/nodes/enroll:
    post:
      security:
        - bearerAuth: []
      summary: Enroll or update a node
      responses:
        "201":
          description: Node enrolled
  /v1/nodes/{nodeID}/desired-state:
    post:
      security:
        - bearerAuth: []
      summary: Create desired state for a node
      parameters:
        - name: nodeID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Desired state version created
  /v1/node/enroll:
    post:
      summary: Enroll node with enrollment bearer token
      responses:
        "201":
          description: Node enrolled and node API token returned
  /v1/node/heartbeat:
    post:
      summary: Node self heartbeat with node bearer token
      responses:
        "200":
          description: Heartbeat recorded
  /v1/node/usage:
    post:
      summary: Submit monotonic usage counters for an active access grant with node bearer token
      responses:
        "202":
          description: Usage accepted
  /v1/node/state:
    get:
      summary: Fetch latest desired state with node bearer token
      responses:
        "200":
          description: Desired state
  /v1/node/state/ack:
    post:
      summary: ACK applied desired-state revision
      responses:
        "200":
          description: Revision acknowledged
  /v1/node/state/fail:
    post:
      summary: Report desired-state apply failure
      responses:
        "200":
          description: Failure recorded
  /v1/access/grants:
    get:
      security:
        - bearerAuth: []
      summary: List current user access grants
      responses:
        "200":
          description: Grant list
    post:
      security:
        - bearerAuth: []
      summary: Create access grant; pilot mobile/desktop should pass device_id and protocol=vless
      responses:
        "201":
          description: Grant created
        "403":
          description: TRAFFIC_LIMIT_REACHED
  /v1/access/grants/{grantID}/config:
    get:
      security:
        - bearerAuth: []
      summary: Get VPN client config contract for a grant; VLESS pilot returns connection_url/share_url
      parameters:
        - name: grantID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Grant config contract
        "404":
          description: Grant not found
  /v1/access/grants/{grantID}/revoke:
    post:
      security:
        - bearerAuth: []
      summary: Revoke a current user access grant and publish desired-state
      parameters:
        - name: grantID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Grant revoked
  /v1/admin/dashboard:
    get:
      security:
        - bearerAuth: []
      summary: Admin operational counters
      responses:
        "200":
          description: Dashboard counters
  /v1/admin/users:
    get:
      security:
        - bearerAuth: []
      summary: Admin user list
      responses:
        "200":
          description: User list
    post:
      security:
        - bearerAuth: []
      summary: Create a user with normalized unique email
      responses:
        "201":
          description: User created
        "409":
          description: Email or username already exists
  /v1/admin/users/{userID}:
    get:
      security:
        - bearerAuth: []
      summary: Normalized user details for the admin user modal (support, admin, superadmin)
      parameters:
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User, live subscription, access credential + subscription URL, traffic, devices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetails"
        "404":
          description: USER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
    patch:
      security:
        - bearerAuth: []
      summary: Update user identity, role, status, or password
      parameters:
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User updated
        "409":
          description: Email or username already exists
    delete:
      security:
        - bearerAuth: []
      summary: Delete a user and cascade owned subscriptions
      parameters:
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User deleted
  /v1/admin/users/{userID}/devices:
    get:
      security:
        - bearerAuth: []
      summary: Registered devices of a user (support, admin, superadmin)
      parameters:
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Device count, limit and list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDevices"
        "404":
          description: USER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
  /v1/admin/users/{userID}/subscriptions:
    post:
      security:
        - bearerAuth: []
      summary: Force-assign a plan to a user without a live subscription (admin, superadmin)
      description: >
        Validates the user and plan, creates and activates the subscription
        (plan terms snapshotted), issues its access grant on the default
        online node, stores it as the subscription's stable credential,
        writes subscription_issued + access_created audit events and returns
        the refreshed user details.
      parameters:
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id]
              properties:
                plan_id:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Subscription issued; refreshed user details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetails"
        "400":
          description: VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "404":
          description: USER_NOT_FOUND or PLAN_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "409":
          description: SUBSCRIPTION_ALREADY_ACTIVE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "422":
          description: PLAN_INACTIVE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "500":
          description: SUBSCRIPTION_CREATE_FAILED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "503":
          description: NO_NODE_AVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
  /v1/admin/users/{userID}/access:
    post:
      security:
        - bearerAuth: []
      summary: Issue the missing access credential of the user's live subscription (admin, superadmin)
      description: >
        For a subscription that has no active credential (bought in the app,
        or created before primary_grant_id existed): issues a grant on the
        default online node, stores it as the stable credential, writes an
        access_created audit event and returns the refreshed user details.
        Idempotent: an existing active credential is kept and nothing is
        created.
      parameters:
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Credential present; refreshed user details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetails"
        "404":
          description: USER_NOT_FOUND or SUBSCRIPTION_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "422":
          description: SUBSCRIPTION_NOT_ACTIVE (past_due, suspended, pending or expired period)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "500":
          description: ACCESS_ISSUE_FAILED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "503":
          description: NO_NODE_AVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
  /v1/admin/users/{userID}/password-reset:
    post:
      security:
        - bearerAuth: []
      summary: Create a one-time password reset link and hand it to the notifier (admin, superadmin)
      description: Only the token hash is stored. The link is never returned, logged or audited.
      parameters:
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Reset link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetResult"
        "404":
          description: USER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "422":
          description: PASSWORD_RESET_CHANNEL_UNAVAILABLE (user has no email)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
  /v1/admin/plans:
    get:
      security:
        - bearerAuth: []
      summary: Admin plan list including inactive/private plans
      responses:
        "200":
          description: Plan list
    post:
      security:
        - bearerAuth: []
      summary: Create an admin-managed plan
      responses:
        "201":
          description: Plan created
  /v1/admin/plans/{planID}:
    put:
      security:
        - bearerAuth: []
      summary: Update an admin-managed plan
      parameters:
        - name: planID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Plan updated
    delete:
      security:
        - bearerAuth: []
      summary: Soft-delete an admin-managed plan
      parameters:
        - name: planID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Plan deleted
  /v1/admin/promo-codes:
    get:
      security:
        - bearerAuth: []
      summary: Promo codes with their activation counts
      responses:
        "200":
          description: "{promo_codes: [...]}"
    post:
      security:
        - bearerAuth: []
      summary: Create a promo code
      description: >
        Body {code (3-40, A-Z 0-9 - _), description?, discount_type
        (percent 1-100 | fixed in minor units), discount_value, currency
        (required for fixed), plan_id? (only for this plan), valid_from?,
        valid_until?, max_activations?, is_active? (default true)}.
      responses:
        "201":
          description: Created
        "400":
          description: Invalid fields
        "409":
          description: PROMO_CODE_TAKEN
  /v1/admin/promo-codes/{promoID}:
    put:
      security:
        - bearerAuth: []
      summary: Update a promo code (same body as create)
      parameters:
        - name: promoID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated
    delete:
      security:
        - bearerAuth: []
      summary: Delete a promo code and its activation history
      parameters:
        - name: promoID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deleted
  /v1/admin/subscriptions:
    get:
      security:
        - bearerAuth: []
      summary: Admin subscription list
      responses:
        "200":
          description: Subscription list
    post:
      security:
        - bearerAuth: []
      summary: Create a subscription for a user with plan, status, and expiry
      responses:
        "201":
          description: Subscription created
  /v1/admin/subscriptions/{subscriptionID}:
    patch:
      security:
        - bearerAuth: []
      summary: Change plan, expiry, limits, or lifecycle status
      parameters:
        - name: subscriptionID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Subscription updated
  /v1/admin/subscriptions/{subscriptionID}/status:
    patch:
      security:
        - bearerAuth: []
      summary: Update subscription lifecycle status
      parameters:
        - name: subscriptionID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Subscription updated
  /v1/admin/devices:
    get:
      security:
        - bearerAuth: []
      summary: Admin device list
      responses:
        "200":
          description: Device list
  /v1/admin/devices/{deviceID}/revoke:
    post:
      security:
        - bearerAuth: []
      summary: Admin revoke device
      parameters:
        - name: deviceID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Device revoked
  /v1/admin/traffic:
    get:
      security:
        - bearerAuth: []
      summary: Admin subscription traffic rows
      responses:
        "200":
          description: Traffic rows
  /v1/admin/audit:
    get:
      security:
        - bearerAuth: []
      summary: Admin audit event list
      responses:
        "200":
          description: Audit event list
  /v1/admin/access/grants:
    get:
      security:
        - bearerAuth: []
      summary: Admin access grant list
      responses:
        "200":
          description: Grant list
  /v1/admin/access/grants/{grantID}/revoke:
    post:
      security:
        - bearerAuth: []
      summary: Admin revoke access grant
      parameters:
        - name: grantID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Grant revoked
  /v1/bot/telegram/identify:
    post:
      security:
        - botServiceToken: []
      summary: Bot-ready contract to identify or link a Telegram user
      responses:
        "200":
          description: Core user returned
  /v1/bot/users/{userID}/overview:
    get:
      security:
        - botServiceToken: []
      summary: Bot-ready contract to fetch user overview
      parameters:
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Account overview
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    botServiceToken:
      type: http
      scheme: bearer
  schemas:
    DomainError:
      type: object
      description: Error model of the account-management endpoints. Older endpoints keep {"code","error"}.
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              example: SUBSCRIPTION_ALREADY_ACTIVE
            message:
              type: string
            request_id:
              type: string
    TrafficSummary:
      type: object
      description: Aggregated usage of the live subscription. Unlimited plan -> limit_bytes, remaining_bytes and used_percent are null.
      properties:
        bytes_up: {type: integer, format: int64}
        bytes_down: {type: integer, format: int64}
        bytes_total: {type: integer, format: int64}
        limit_bytes: {type: integer, format: int64, nullable: true}
        remaining_bytes: {type: integer, format: int64, nullable: true}
        used_percent: {type: number, nullable: true}
    AdminUserDevices:
      type: object
      properties:
        registered:
          type: integer
          description: Non-revoked devices
        limit:
          type: integer
          nullable: true
          description: Device limit of the live subscription; null without one
        items:
          type: array
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              device_public_id: {type: string}
              name: {type: string}
              platform: {type: string, nullable: true}
              subscription_id: {type: string, format: uuid, nullable: true}
              status: {type: string, enum: [active, revoked]}
              created_at: {type: string, format: date-time}
              last_seen_at: {type: string, format: date-time, nullable: true}
              revoked_at: {type: string, format: date-time, nullable: true}
    AdminUserDetails:
      type: object
      properties:
        user:
          type: object
          properties:
            id: {type: string, format: uuid}
            email: {type: string}
            username: {type: string}
            role: {type: string}
            status: {type: string}
            created_at: {type: string, format: date-time}
            last_login_at: {type: string, format: date-time, nullable: true}
            disabled_at: {type: string, format: date-time, nullable: true}
        subscription:
          type: object
          nullable: true
          description: The user's one live subscription (pending, trialing, active, past_due, suspended); null when none
          properties:
            id: {type: string, format: uuid}
            status: {type: string}
            source: {type: string}
            plan:
              type: object
              nullable: true
              properties:
                id: {type: string, format: uuid}
                code: {type: string}
                name: {type: string}
                price_minor: {type: integer}
                currency: {type: string}
                interval: {type: string}
                duration_days: {type: integer, nullable: true}
                traffic_limit_bytes: {type: integer, format: int64, nullable: true}
                device_limit: {type: integer}
                is_active: {type: boolean}
            started_at: {type: string, format: date-time, nullable: true}
            expires_at: {type: string, format: date-time}
            traffic_limit_bytes: {type: integer, format: int64, nullable: true}
            device_limit: {type: integer}
        access:
          type: object
          properties:
            credential_id:
              type: string
              format: uuid
              description: Access grant id nodes authenticate with (VLESS UUID / Hysteria2 user); the subscription's primary grant
            subscription_url:
              type: string
              description: Built centrally from WAVEBREAK_SUBSCRIPTION_URL_BASE + credential_id. Sensitive.
            active_grants: {type: integer}
            grants:
              type: array
              items:
                type: object
                properties:
                  id: {type: string, format: uuid}
                  node_id: {type: string, format: uuid}
                  node_code: {type: string}
                  device_id: {type: string, format: uuid, nullable: true}
                  protocol: {type: string}
                  status: {type: string}
                  expires_at: {type: string, format: date-time}
                  created_at: {type: string, format: date-time}
        traffic:
          allOf:
            - $ref: "#/components/schemas/TrafficSummary"
          nullable: true
        devices:
          $ref: "#/components/schemas/AdminUserDevices"
        connections:
          type: object
          description: Reserved for node telemetry; active stays null until nodes report live connections
          properties:
            active: {type: integer, nullable: true}
            source: {type: string, example: not_reported}
    PasswordResetResult:
      type: object
      properties:
        status: {type: string, enum: [reset_link_created]}
        channel: {type: string, enum: [email]}
        delivery:
          type: string
          description: sent, not_configured (no email provider in Core yet) or failed
        expires_at: {type: string, format: date-time}
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
