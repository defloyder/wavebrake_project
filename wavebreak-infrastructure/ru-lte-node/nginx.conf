# worker_connections defaults to 512 — found the hard way (ru-entry/deploy.sh,
# a real live client opened 200+ simultaneous connections and nginx started
# hard-rejecting the overflow) that this is nowhere near enough for a VPN
# relay. worker_rlimit_nofile must rise to match (the directive alone is
# capped by the OS/container fd limit otherwise) — see this node's docker
# run needing --ulimit nofile=65535:65535 to match.
worker_rlimit_nofile 65535;
events {
  worker_connections 65535;
}
stream {
  map $ssl_preread_server_name $tls_backend {
    ya.ru 127.0.0.1:18501;
    yandex.ru 127.0.0.1:18501;
    mail.ru 127.0.0.1:18501;
    vk.com 127.0.0.1:18501;
    ru2.wavebreak.com.tr    127.0.0.1:18502;
    ws.ru2.wavebreak.com.tr 127.0.0.1:18503;
    default                 127.0.0.1:18503;
  }
  server {
    listen 443 reuseport;
    listen [::]:443 reuseport;
    proxy_pass $tls_backend;
    proxy_protocol on;
    ssl_preread on;
    proxy_connect_timeout 5s;
    proxy_timeout 1h;
  }
}
