services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - wavebreak_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  wavebreak-migrate:
    build:
      context: ../wavebreak-core
    command: ["wavebreak-migrate"]
    environment:
      WAVEBREAK_ENV: development
      WAVEBREAK_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      WAVEBREAK_REDIS_ADDR: redis:6379
      WAVEBREAK_RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      WAVEBREAK_JWT_SECRET: ${WAVEBREAK_JWT_SECRET}
      WAVEBREAK_BOT_SERVICE_TOKEN: ${WAVEBREAK_BOT_SERVICE_TOKEN}
      WAVEBREAK_VLESS_PUBLIC_HOST: ${WAVEBREAK_VLESS_PUBLIC_HOST:-}
      WAVEBREAK_VLESS_PORT: ${WAVEBREAK_VLESS_PORT:-18443}
      WAVEBREAK_VLESS_REALITY_PUBLIC_KEY: ${XRAY_REALITY_PUBLIC_KEY:-}
      WAVEBREAK_VLESS_REALITY_SHORT_ID: ${XRAY_REALITY_SHORT_ID:-}
      WAVEBREAK_VLESS_REALITY_SERVER_NAME: ${XRAY_REALITY_SERVER_NAME:-www.microsoft.com}
      WAVEBREAK_VLESS_FINGERPRINT: ${WAVEBREAK_VLESS_FINGERPRINT:-chrome}
      WAVEBREAK_VLESS_FLOW: ${WAVEBREAK_VLESS_FLOW:-none}
    depends_on:
      postgres:
        condition: service_healthy

  wavebreak-api:
    build:
      context: ../wavebreak-core
    restart: unless-stopped
    command: ["wavebreak-api"]
    environment:
      WAVEBREAK_ENV: development
      WAVEBREAK_HTTP_ADDR: :8080
      WAVEBREAK_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      WAVEBREAK_REDIS_ADDR: redis:6379
      WAVEBREAK_RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      WAVEBREAK_JWT_SECRET: ${WAVEBREAK_JWT_SECRET}
      WAVEBREAK_BOT_SERVICE_TOKEN: ${WAVEBREAK_BOT_SERVICE_TOKEN}
      WAVEBREAK_VLESS_PUBLIC_HOST: ${WAVEBREAK_VLESS_PUBLIC_HOST:-}
      WAVEBREAK_VLESS_PORT: ${WAVEBREAK_VLESS_PORT:-18443}
      WAVEBREAK_VLESS_REALITY_PUBLIC_KEY: ${XRAY_REALITY_PUBLIC_KEY:-}
      WAVEBREAK_VLESS_REALITY_SHORT_ID: ${XRAY_REALITY_SHORT_ID:-}
      WAVEBREAK_VLESS_REALITY_SERVER_NAME: ${XRAY_REALITY_SERVER_NAME:-www.microsoft.com}
      WAVEBREAK_VLESS_FINGERPRINT: ${WAVEBREAK_VLESS_FINGERPRINT:-chrome}
      WAVEBREAK_VLESS_FLOW: ${WAVEBREAK_VLESS_FLOW:-none}
      WAVEBREAK_SS_PORT: ${WAVEBREAK_SS_PORT:-0}
      WAVEBREAK_SS_METHOD: ${WAVEBREAK_SS_METHOD:-aes-256-gcm}
      WAVEBREAK_VLESS_CDN_HOST: ${WAVEBREAK_VLESS_CDN_HOST:-}
      WAVEBREAK_VLESS_CDN_PORT: ${WAVEBREAK_VLESS_CDN_PORT:-0}
      WAVEBREAK_VLESS_CDN_WS_PATH: ${WAVEBREAK_VLESS_CDN_WS_PATH:-/wvb-ws}
    ports:
      - "${WAVEBREAK_API_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      wavebreak-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  wavebreak-worker:
    build:
      context: ../wavebreak-core
    restart: unless-stopped
    command: ["wavebreak-worker"]
    environment:
      WAVEBREAK_ENV: development
      WAVEBREAK_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      WAVEBREAK_REDIS_ADDR: redis:6379
      WAVEBREAK_RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      WAVEBREAK_JWT_SECRET: ${WAVEBREAK_JWT_SECRET}
      WAVEBREAK_BOT_SERVICE_TOKEN: ${WAVEBREAK_BOT_SERVICE_TOKEN}
    depends_on:
      wavebreak-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  wavebreak-web:
    build:
      context: ../wavebreak-web
    restart: unless-stopped
    environment:
      APP_NAME: WAVEBREAK
      APP_ENV: local
      APP_KEY: ${WEB_APP_KEY}
      APP_DEBUG: "false"
      APP_URL: http://${WAVEBREAK_PUBLIC_HOST:-127.0.0.1}:${WAVEBREAK_WEB_PORT:-18000}
      WAVEBREAK_CORE_URL: http://wavebreak-api:8080
      SESSION_DRIVER: file
    ports:
      - "${WAVEBREAK_WEB_PORT:-18000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@file_get_contents('http://127.0.0.1:8000/') === false ? 1 : 0);\""]
      interval: 15s
      timeout: 5s
      retries: 10
    depends_on:
      wavebreak-api:
        condition: service_healthy

  wavebreak-admin:
    build:
      context: ../wavebreak-admin
    restart: unless-stopped
    environment:
      APP_NAME: WAVEBREAK Admin
      APP_ENV: local
      APP_KEY: ${ADMIN_APP_KEY}
      APP_DEBUG: "false"
      APP_URL: http://${WAVEBREAK_PUBLIC_HOST:-127.0.0.1}:${WAVEBREAK_ADMIN_PORT:-18002}
      WAVEBREAK_CORE_URL: http://wavebreak-api:8080
      SESSION_DRIVER: file
    ports:
      - "${WAVEBREAK_ADMIN_PORT:-18002}:8000"
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@file_get_contents('http://127.0.0.1:8000/') === false ? 1 : 0);\""]
      interval: 15s
      timeout: 5s
      retries: 10
    depends_on:
      wavebreak-api:
        condition: service_healthy

  wavebreak-node:
    build:
      context: ../wavebreak-node
    restart: unless-stopped
    environment:
      WAVEBREAK_CORE_URL: http://wavebreak-api:8080
      WAVEBREAK_NODE_ENROLLMENT_TOKEN: ${WAVEBREAK_NODE_ENROLLMENT_TOKEN}
      WAVEBREAK_NODE_CODE: ${WAVEBREAK_NODE_CODE:-NL-PILOT-01}
      WAVEBREAK_NODE_REGION: ${WAVEBREAK_NODE_REGION:-NL}
      WAVEBREAK_NODE_HEARTBEAT_INTERVAL: 30s
      WAVEBREAK_NODE_SYNC_INTERVAL: 20s
      WAVEBREAK_RUNTIME_ADAPTER: ${WAVEBREAK_RUNTIME_ADAPTER:-xray}
      WAVEBREAK_XRAY_CONFIG_PATH: /etc/wavebreak/xray/config.json
      # Must match wavebreak-xray's own listen port below: with
      # network_mode: host there is no Docker port mapping to bridge a
      # different internal/external port, so both read the same public port.
      WAVEBREAK_XRAY_LISTEN_PORT: ${WAVEBREAK_VLESS_PORT:-18443}
      WAVEBREAK_XRAY_REALITY_PRIVATE_KEY: ${XRAY_REALITY_PRIVATE_KEY:-}
      WAVEBREAK_XRAY_REALITY_SHORT_ID: ${XRAY_REALITY_SHORT_ID:-}
      WAVEBREAK_XRAY_REALITY_DEST: ${XRAY_REALITY_DEST:-www.microsoft.com:443}
      WAVEBREAK_XRAY_REALITY_SERVER_NAME: ${XRAY_REALITY_SERVER_NAME:-www.microsoft.com}
      WAVEBREAK_XRAY_FLOW: ${WAVEBREAK_VLESS_FLOW:-none}
      WAVEBREAK_XRAY_SS_PORT: ${WAVEBREAK_XRAY_SS_PORT:-0}
      WAVEBREAK_XRAY_SS_METHOD: ${WAVEBREAK_SS_METHOD:-aes-256-gcm}
      WAVEBREAK_XRAY_DOCKER_CONTAINER: wavebreak-pilot-xray
      WAVEBREAK_XRAY_CDN_LISTEN_PORT: ${WAVEBREAK_VLESS_CDN_PORT:-0}
      WAVEBREAK_XRAY_CDN_WS_PATH: ${WAVEBREAK_VLESS_CDN_WS_PATH:-/wvb-ws}
      WAVEBREAK_XRAY_CDN_TLS_CERT_PATH: ${WAVEBREAK_XRAY_CDN_TLS_CERT_PATH:-}
      WAVEBREAK_XRAY_CDN_TLS_KEY_PATH: ${WAVEBREAK_XRAY_CDN_TLS_KEY_PATH:-}
    depends_on:
      wavebreak-api:
        condition: service_healthy
      wavebreak-xray:
        condition: service_started
    user: "0:0"
    volumes:
      - wavebreak_xray_config:/etc/wavebreak/xray
      - /var/run/docker.sock:/var/run/docker.sock

  wavebreak-xray:
    image: teddysun/xray:latest
    container_name: wavebreak-pilot-xray
    restart: unless-stopped
    # host networking: Docker's userland docker-proxy relay for published
    # ports has been observed to accept the client's TCP handshake and then
    # silently hang right after the REALITY TLS ClientHello, even though the
    # Xray process itself answers correctly on its container-internal
    # address. Binding directly to the host's real interface skips that
    # relay (and the NAT/DNAT path) entirely.
    network_mode: host
    environment:
      XRAY_CONFIG_PATH: /etc/xray/config.json
      XRAY_LISTEN_PORT: ${WAVEBREAK_VLESS_PORT:-18443}
      XRAY_REALITY_PRIVATE_KEY: ${XRAY_REALITY_PRIVATE_KEY}
      XRAY_REALITY_SHORT_ID: ${XRAY_REALITY_SHORT_ID}
      XRAY_REALITY_DEST: ${XRAY_REALITY_DEST:-www.microsoft.com:443}
      XRAY_REALITY_SERVER_NAME: ${XRAY_REALITY_SERVER_NAME:-www.microsoft.com}
    command: ["/bin/sh", "/usr/local/bin/start-xray.sh"]
    volumes:
      - wavebreak_xray_config:/etc/xray
      - ./xray/start-xray.sh:/usr/local/bin/start-xray.sh:ro

volumes:
  wavebreak_postgres:
  wavebreak_xray_config:
