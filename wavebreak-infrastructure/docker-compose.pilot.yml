services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - wavebreak_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  wavebreak-migrate:
    build:
      context: ../wavebreak-core
    command: ["wavebreak-migrate"]
    environment:
      WAVEBREAK_ENV: development
      WAVEBREAK_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      WAVEBREAK_REDIS_ADDR: redis:6379
      WAVEBREAK_RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      WAVEBREAK_JWT_SECRET: ${WAVEBREAK_JWT_SECRET}
      WAVEBREAK_BOT_SERVICE_TOKEN: ${WAVEBREAK_BOT_SERVICE_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy

  wavebreak-api:
    build:
      context: ../wavebreak-core
    restart: unless-stopped
    command: ["wavebreak-api"]
    environment:
      WAVEBREAK_ENV: development
      WAVEBREAK_HTTP_ADDR: :8080
      WAVEBREAK_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      WAVEBREAK_REDIS_ADDR: redis:6379
      WAVEBREAK_RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      WAVEBREAK_JWT_SECRET: ${WAVEBREAK_JWT_SECRET}
      WAVEBREAK_BOT_SERVICE_TOKEN: ${WAVEBREAK_BOT_SERVICE_TOKEN}
    ports:
      - "${WAVEBREAK_API_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      wavebreak-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  wavebreak-worker:
    build:
      context: ../wavebreak-core
    restart: unless-stopped
    command: ["wavebreak-worker"]
    environment:
      WAVEBREAK_ENV: development
      WAVEBREAK_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      WAVEBREAK_REDIS_ADDR: redis:6379
      WAVEBREAK_RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      WAVEBREAK_JWT_SECRET: ${WAVEBREAK_JWT_SECRET}
      WAVEBREAK_BOT_SERVICE_TOKEN: ${WAVEBREAK_BOT_SERVICE_TOKEN}
    depends_on:
      wavebreak-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  wavebreak-web:
    build:
      context: ../wavebreak-web
    restart: unless-stopped
    environment:
      APP_NAME: WAVEBREAK
      APP_ENV: local
      APP_KEY: ${WEB_APP_KEY}
      APP_DEBUG: "false"
      APP_URL: http://${WAVEBREAK_PUBLIC_HOST:-127.0.0.1}:${WAVEBREAK_WEB_PORT:-18000}
      WAVEBREAK_CORE_URL: http://wavebreak-api:8080
      SESSION_DRIVER: file
    ports:
      - "${WAVEBREAK_WEB_PORT:-18000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@file_get_contents('http://127.0.0.1:8000/') === false ? 1 : 0);\""]
      interval: 15s
      timeout: 5s
      retries: 10
    depends_on:
      wavebreak-api:
        condition: service_healthy

  wavebreak-admin:
    build:
      context: ../wavebreak-admin
    restart: unless-stopped
    environment:
      APP_NAME: WAVEBREAK Admin
      APP_ENV: local
      APP_KEY: ${ADMIN_APP_KEY}
      APP_DEBUG: "false"
      APP_URL: http://${WAVEBREAK_PUBLIC_HOST:-127.0.0.1}:${WAVEBREAK_ADMIN_PORT:-18002}
      WAVEBREAK_CORE_URL: http://wavebreak-api:8080
      SESSION_DRIVER: file
    ports:
      - "${WAVEBREAK_ADMIN_PORT:-18002}:8000"
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@file_get_contents('http://127.0.0.1:8000/') === false ? 1 : 0);\""]
      interval: 15s
      timeout: 5s
      retries: 10
    depends_on:
      wavebreak-api:
        condition: service_healthy

  wavebreak-node:
    build:
      context: ../wavebreak-node
    restart: unless-stopped
    environment:
      WAVEBREAK_CORE_URL: http://wavebreak-api:8080
      WAVEBREAK_NODE_ENROLLMENT_TOKEN: ${WAVEBREAK_NODE_ENROLLMENT_TOKEN}
      WAVEBREAK_NODE_CODE: ${WAVEBREAK_NODE_CODE:-NL-PILOT-01}
      WAVEBREAK_NODE_REGION: ${WAVEBREAK_NODE_REGION:-NL}
      WAVEBREAK_NODE_HEARTBEAT_INTERVAL: 30s
      WAVEBREAK_NODE_SYNC_INTERVAL: 20s
    depends_on:
      wavebreak-api:
        condition: service_healthy

volumes:
  wavebreak_postgres:
