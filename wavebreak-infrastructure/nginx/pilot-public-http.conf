events {}

stream {
  map $ssl_preread_server_name $tls_backend {
    direct.wavebreak.com.tr 127.0.0.1:18444;
    # VLESS+REALITY's SNI-mimicry target — REALITY needs the raw, untouched
    # TLS ClientHello to do its cert-borrowing trick, which ssl_preread's
    # peek-only routing preserves (same as the direct.wavebreak.com.tr line
    # above: nginx never terminates TLS here, just forwards the raw bytes).
    # Routed onto the shared public 443 instead of the standalone 8443 it
    # used to have, since a non-standard TCP port is a common thing for
    # mobile carriers to filter/block outright regardless of DPI.
    www.cloudflare.com     127.0.0.1:8443;
    # REALITY on our own DNS-only name (bug 8): a www.cloudflare.com SNI
    # to a non-Cloudflare hosting IP is exactly the mismatch carrier DPI
    # (TSPU) freezes after the first KB — handshake OK, no data. This name
    # really resolves to this IP. Its REALITY `dest` is 127.0.0.1:18447
    # below, so unauthenticated probes see the real site with a valid cert.
    r.wavebreak.com.tr      127.0.0.1:8443;
    www.microsoft.com       127.0.0.1:8443;
    # VLESS XHTTP+REALITY masked as a Russian site (REALITY dest ya.ru:443):
    # own-domain SNIs (r., x., direct.) got blocked by SNI on RU mobile
    # networks once they carried proxy traffic, 2026-09-27.
    ya.ru                   127.0.0.1:8445;
    wavebreak.com.tr        127.0.0.1:18445;
    www.wavebreak.com.tr    127.0.0.1:18445;
    # admin.wavebreak.com.tr: intentionally absent — the admin panel is only
    # reachable over the ops WireGuard tunnel (10.66.0.1:9443, see below and
    # ../wireguard/README.md). Its SNI now falls through to `default`.
    # Direct (DNS-only) API host for the apps: Cloudflare-fronted api.* stalls on
    # some Russian mobile networks (responses never arrive), 2026-09-27.
    core.wavebreak.com.tr   127.0.0.1:18446;
    api.wavebreak.com.tr    127.0.0.1:18446;
    sub.wavebreak.com.tr    127.0.0.1:18446;
    default                 127.0.0.1:18444;
  }

  server {
    listen 443 reuseport;
    proxy_pass $tls_backend;
    proxy_protocol on;
    ssl_preread on;
    proxy_connect_timeout 5s;
    proxy_timeout 1h;
  }
}

http {
  server_tokens off;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:WAVEBREAK:10m;
  ssl_session_timeout 1d;

  # /v1/sub/<token> carries a per-subscriber identifier in the path. We still
  # want timing/status/client-app visibility to debug "VPN is acting up"
  # reports (that's what $request_time and $http_user_agent are for below),
  # just not a log that ties those reports to one person's account forever.
  map $uri $log_uri {
    ~^/v1/sub/  "/v1/sub/-";
    default     $uri;
  }
  log_format diag '$remote_addr - [$time_local] "$request_method $log_uri $server_protocol" '
                  '$status $body_bytes_sent rt=$request_time "$http_user_agent"';

  server {
    listen 127.0.0.1:18445 ssl proxy_protocol;
    server_name wavebreak.com.tr www.wavebreak.com.tr;
    ssl_certificate /etc/letsencrypt/live/wavebreak.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wavebreak.com.tr/privkey.pem;
    # The stream block above now prepends a PROXY protocol header so the
    # real client IP survives the loopback hop instead of showing as
    # 127.0.0.1 (nginx itself is the only thing that can send it here).
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/xml image/svg+xml application/manifest+json text/plain;

    # Static assets: CSS/JS are cache-busted with ?v=, fonts and images rarely change.
    location ~* \.(?:css|js|woff2|png|jpg|jpeg|webp|svg|ico|webmanifest)$ {
      proxy_pass http://127.0.0.1:18000;
      include /etc/nginx/proxy_params;
      proxy_hide_header Cache-Control;
      add_header Cache-Control "public, max-age=2592000" always;
    }

    # Password reset page: served by Core (the site itself is untouched).
    location = /reset-password {
      proxy_pass http://127.0.0.1:18080;
      include /etc/nginx/proxy_params;
    }

    location / {
      proxy_pass http://127.0.0.1:18000;
      include /etc/nginx/proxy_params;
    }
  }

  # REALITY `dest` for r.wavebreak.com.tr (XRAY_REALITY_DEST): a real TLS
  # 1.3 endpoint with this name's own certificate, serving the public site.
  server {
    listen 127.0.0.1:18447 ssl;
    server_name r.wavebreak.com.tr;
    ssl_certificate /etc/letsencrypt/live/r.wavebreak.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/r.wavebreak.com.tr/privkey.pem;

    location / {
      proxy_pass http://127.0.0.1:18000;
      include /etc/nginx/proxy_params;
    }
  }

  # REALITY dest of the XHTTP+REALITY inbound: this name's own certificate,
  # serving the public site, like 18447 does for r.wavebreak.com.tr.
  server {
    listen 127.0.0.1:18448 ssl;
    server_name x.wavebreak.com.tr;
    ssl_certificate /etc/letsencrypt/live/x.wavebreak.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/x.wavebreak.com.tr/privkey.pem;

    location / {
      proxy_pass http://127.0.0.1:18000;
      include /etc/nginx/proxy_params;
    }
  }

  # Admin panel — reachable ONLY over the ops WireGuard tunnel. nginx binds
  # directly to the wg0 address (net.ipv4.ip_nonlocal_bind=1 lets it start
  # even before wg0 is up), so there is no public socket for this vhost.
  server {
    listen 10.66.0.1:9443 ssl;
    server_name admin.wavebreak.com.tr;
    ssl_certificate /etc/letsencrypt/live/wavebreak.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wavebreak.com.tr/privkey.pem;

    # Not proxy_params: the app must see the non-default :9443 port, or
    # Laravel builds asset/redirect URLs for :443, which no longer serves admin.
    location / {
      proxy_pass http://127.0.0.1:18002;
      proxy_http_version 1.1;
      proxy_set_header Host $host:9443;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host:9443;
      proxy_set_header X-Forwarded-Port 9443;
    }
  }

  server {
    listen 80;
    server_name wavebreak.com.tr www.wavebreak.com.tr;

    location ^~ /.well-known/acme-challenge/ {
      root /var/www/acme;
      default_type text/plain;
    }

    location / {
      proxy_pass http://127.0.0.1:18000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
    }
  }

  # admin.* stays in the wavebreak.com.tr certificate's SAN, so keep only its
  # ACME HTTP-01 path here; nothing on port 80 proxies to the admin panel.
  server {
    listen 80;
    server_name admin.wavebreak.com.tr;

    location ^~ /.well-known/acme-challenge/ {
      root /var/www/acme;
      default_type text/plain;
    }

    location / {
      return 404;
    }
  }

  server {
    listen 127.0.0.1:18446 ssl proxy_protocol;
    server_name api.wavebreak.com.tr sub.wavebreak.com.tr;
    ssl_certificate /etc/letsencrypt/live/api.wavebreak.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.wavebreak.com.tr/privkey.pem;
    access_log /dev/stdout diag;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    location / {
      proxy_pass http://127.0.0.1:18080;
      include /etc/nginx/proxy_params;
    }
  }

  server {
    listen 127.0.0.1:18446 ssl proxy_protocol;
    server_name core.wavebreak.com.tr;
    ssl_certificate /etc/letsencrypt/live/core.wavebreak.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/core.wavebreak.com.tr/privkey.pem;
    access_log /dev/stdout diag;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    location / {
      proxy_pass http://127.0.0.1:18080;
      include /etc/nginx/proxy_params;
    }
  }

  server {
    listen 80;
    server_name sub.wavebreak.com.tr api.wavebreak.com.tr;
    access_log /dev/stdout diag;

    location / {
      proxy_pass http://127.0.0.1:18080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
    }
  }
}
