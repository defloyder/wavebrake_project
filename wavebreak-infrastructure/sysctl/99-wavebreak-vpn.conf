# WAVEBREAK VPN transport tuning for VLESS/TLS and Hysteria2/QUIC.
# Apply on VPN nodes, not inside ordinary app containers:
#   sudo cp 99-wavebreak-vpn.conf /etc/sysctl.d/
#   sudo sysctl --system

net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.core.netdev_max_backlog = 10000
net.core.default_qdisc = fq

net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384

net.ipv4.tcp_rmem = 4096 87380 67108864
net.ipv4.tcp_wmem = 4096 65536 67108864
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_tw_reuse = 1
net.ipv4.ip_local_port_range = 10240 65535
net.ipv4.tcp_fin_timeout = 20
net.ipv4.tcp_keepalive_time = 600
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5

# BBR needs a real PMTU, not ICMP-dependent discovery, on paths where
# adversarial middleboxes drop ICMP; and idle VPN sessions shouldn't
# re-slow-start after a pause.
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_slow_start_after_idle = 0

# Idle/rarely-touched containers (admin panel) were being swapped out
# with 4G+ RAM still free, causing latency spikes on next access.
vm.swappiness = 10

# Mobile clients (carrier NAT/tower handover) legitimately send TCP
# segments slightly outside conntrack's expected window. Strict tracking
# (default) marks these INVALID and ufw-before-input silently drops them
# mid-session on an already-ESTABLISHED connection — seen as port-443
# ACK drops from mobile-carrier source IPs while a Direct-TLS session
# was active, which clients experience as stalling, not a disconnect.
net.netfilter.nf_conntrack_tcp_be_liberal = 1
