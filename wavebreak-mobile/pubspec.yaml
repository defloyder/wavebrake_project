name: wavebreak
description: WAVEBREAK — premium simple connectivity.
publish_to: "none"
version: 1.1.7+19

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  local_auth: ^2.3.0
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  device_info_plus: ^11.3.0
  package_info_plus: ^8.3.0
  connectivity_plus: ^6.1.4
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  intl: ^0.20.2
  collection: ^1.19.1
  crypto: ^3.0.5
  path_provider: ^2.1.5
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3
  image: ^4.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/wavebreak_icon_1024.png"
  adaptive_icon_background: "#0B1020"
  adaptive_icon_foreground: "assets/branding/wavebreak_icon_1024.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/branding/wavebreak_icon_1024.png"
    background_color: "#0B1020"
    theme_color: "#0B1020"
  windows:
    generate: true
    image_path: "assets/branding/wavebreak_icon_1024.png"
    icon_size: 256
