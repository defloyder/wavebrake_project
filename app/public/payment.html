<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Оплата подписки — Auralith</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://widget.cloudpayments.ru/bundles/cloudpayments.js"></script>
    <style>
      :root {
        --bg: #0a0f18;
        --surface: #111a2a;
        --text: #e6ebf3;
        --muted: #8a94a6;
        --line: rgba(138, 148, 166, 0.2);
        --accent: #4f7eb5;
        --accent-2: #6b93c0;
        --radius: 18px;
        --shadow: 0 30px 70px rgba(2, 6, 14, 0.6);
      }
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: "Inter", sans-serif;
        background: radial-gradient(circle at 90% 0%, #152237 0%, transparent 30%), var(--bg);
        color: var(--text);
        line-height: 1.55;
        min-height: 100vh;
      }
      .payment-wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
      }
      .payment-card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 2.5rem 2rem;
        max-width: 440px;
        width: 100%;
        box-shadow: var(--shadow);
        text-align: center;
      }
      .payment-card h1 {
        font-size: 1.4rem;
        margin: 0 0 0.5rem;
        color: var(--text);
      }
      .payment-card .plan-name {
        color: var(--muted);
        font-size: 0.95rem;
        margin-bottom: 1.5rem;
      }
      .payment-amount {
        font-size: 2.5rem;
        font-weight: 700;
        color: var(--accent-2);
        margin-bottom: 1.75rem;
      }
      .btn-pay {
        display: inline-block;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 12px;
        padding: 0.85rem 2.5rem;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
        width: 100%;
      }
      .btn-pay:hover { background: var(--accent-2); }
      .btn-pay:disabled { opacity: 0.5; cursor: not-allowed; }
      .status-msg {
        margin-top: 1.5rem;
        padding: 1rem;
        border-radius: 10px;
        font-size: 0.95rem;
        display: none;
      }
      .status-msg.success {
        background: rgba(79, 126, 181, 0.15);
        border: 1px solid rgba(79, 126, 181, 0.4);
        color: #7fb3e8;
      }
      .status-msg.error {
        background: rgba(220, 80, 80, 0.12);
        border: 1px solid rgba(220, 80, 80, 0.35);
        color: #e88080;
      }
      .order-id {
        font-size: 0.75rem;
        color: var(--muted);
        margin-top: 1.5rem;
        word-break: break-all;
      }
      .loader {
        color: var(--muted);
        font-size: 0.95rem;
        padding: 2rem 0;
      }
    </style>
  </head>
  <body>
    <div class="page-glow page-glow-top"></div>
    <div class="page-glow page-glow-bottom"></div>

    <div class="payment-wrap">
      <div class="payment-card">
        <div id="loading" class="loader">Загрузка...</div>

        <div id="pay-content" style="display:none">
          <h1>Оплата подписки</h1>
          <div class="plan-name" id="plan-name"></div>
          <div class="payment-amount" id="amount-display"></div>
          <button class="btn-pay" id="pay-btn" onclick="startPayment()">
            Оплатить картой
          </button>
          <div class="status-msg" id="status-msg"></div>
          <div class="order-id" id="order-id-display"></div>
        </div>

        <div id="paid-content" style="display:none">
          <div class="status-msg success" style="display:block">
            ✅ Этот заказ уже оплачен.
          </div>
        </div>

        <div id="error-content" style="display:none">
          <div class="status-msg error" style="display:block">
            ❌ Заказ не найден.
          </div>
        </div>
      </div>
    </div>

    <script>
      const PLAN_NAMES = { 1: "1 месяц", 3: "3 месяца", 12: "1 год" };
      const API_BASE = "https://auralith.ru";
      const CP_PUBLIC_ID = "pk_d1c22236a8f9ef6702643099d2bec";

      let orderData = null;

      function getOrderId() {
        const parts = window.location.pathname.split("/");
        return parts[parts.length - 1] || parts[parts.length - 2];
      }

      async function loadOrder() {
        const orderId = getOrderId();
        if (!orderId) {
          showError();
          return;
        }

        try {
          const resp = await fetch(`${API_BASE}/payments/cp/order/${orderId}`);
          if (resp.status === 404) { showError(); return; }
          if (!resp.ok) { showError(); return; }

          orderData = await resp.json();

          if (orderData.status === "paid") {
            document.getElementById("loading").style.display = "none";
            document.getElementById("paid-content").style.display = "block";
            return;
          }

          document.getElementById("loading").style.display = "none";
          document.getElementById("pay-content").style.display = "block";
          document.getElementById("plan-name").textContent =
            PLAN_NAMES[orderData.plan_id] || "Подписка Auralith";
          document.getElementById("amount-display").textContent =
            orderData.amount.toFixed(2) + " ₽";
          document.getElementById("order-id-display").textContent =
            "Заказ: " + orderData.order_id;
        } catch (e) {
          showError();
        }
      }

      function showError() {
        document.getElementById("loading").style.display = "none";
        document.getElementById("error-content").style.display = "block";
      }

      function showStatus(msg, type) {
        const el = document.getElementById("status-msg");
        el.textContent = msg;
        el.className = "status-msg " + type;
        el.style.display = "block";
      }

      function startPayment() {
        if (!orderData) return;

        const btn = document.getElementById("pay-btn");
        btn.disabled = true;

        const widget = new cp.CloudPayments();
        const recurrent = orderData.recurrent_params
          ? {
              interval: orderData.recurrent_params.interval,
              period: orderData.recurrent_params.period,
            }
          : null;

        const params = {
          publicTerminalId: CP_PUBLIC_ID,
          description: "Подписка Auralith — " + (PLAN_NAMES[orderData.plan_id] || ""),
          paymentSchema: "Single",
          currency: orderData.currency || "RUB",
          amount: orderData.amount,
          externalId: orderData.order_id,
          skin: "modern",
          userInfo: { accountId: orderData.order_id },
        };

        if (recurrent) {
          params.recurrent = recurrent;
        }

        widget.oncomplete = function (result) {
          if (result && result.status === "success") {
            showStatus(
              "✅ Оплата прошла успешно! Вернитесь в Telegram-бот — подписка активируется автоматически.",
              "success"
            );
            btn.style.display = "none";
          } else if (result && result.status === "fail") {
            showStatus("❌ Оплата не прошла. Попробуйте ещё раз.", "error");
            btn.disabled = false;
          } else {
            btn.disabled = false;
          }
        };

        widget.start(params).catch(function () {
          btn.disabled = false;
        });
      }

      loadOrder();
    </script>
  </body>
</html>
