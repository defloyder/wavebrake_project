<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auralith Auto Contact Cards</title>
  <style>
    @font-face {
      font-family: "Manrope";
      src: url("fonts/Manrope.ttf") format("truetype");
      font-weight: 500 900;
      font-display: swap;
    }

    :root {
      --bg: #05070b;
      --panel: #080b11;
      --text: #f8fbff;
      --muted: rgba(248, 251, 255, .72);
      --line: rgba(255, 255, 255, .16);
      --blue: #2ea0ff;
      --violet: #a259ff;
      --pink: #e148ff;
      --green: #59d69b;
      --amber: #f3bc55;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #111;
      color: var(--text);
      font-family: Manrope, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      padding: 32px;
    }

    .sheet {
      display: grid;
      gap: 28px;
      justify-items: center;
    }

    .card {
      width: 1500px;
      height: 800px;
      position: relative;
      overflow: hidden;
      border-radius: 42px;
      padding: 48px;
      background:
        radial-gradient(780px 420px at 12% 0%, rgba(46, 160, 255, .22), transparent 62%),
        radial-gradient(640px 420px at 100% 0%, rgba(225, 72, 255, .2), transparent 64%),
        linear-gradient(180deg, #0b0e14 0%, var(--bg) 100%);
      box-shadow: 0 32px 90px rgba(0, 0, 0, .55);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 12px;
      border: 5px solid transparent;
      border-radius: 34px;
      background:
        linear-gradient(var(--panel), var(--panel)) padding-box,
        linear-gradient(100deg, var(--blue), var(--violet), var(--pink)) border-box;
      opacity: .96;
      pointer-events: none;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 34px;
      background:
        linear-gradient(90deg, transparent, rgba(255, 255, 255, .08), transparent),
        repeating-linear-gradient(135deg, rgba(255, 255, 255, .025) 0 2px, transparent 2px 18px);
      pointer-events: none;
    }

    .card__inner {
      position: relative;
      z-index: 1;
      height: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 42px;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin: 0 auto 36px;
    }

    .brand img {
      width: 118px;
      height: 118px;
      object-fit: contain;
      filter: drop-shadow(0 20px 38px rgba(46, 160, 255, .28));
    }

    .brand span {
      display: block;
      color: white;
      font-size: 82px;
      line-height: 1;
      font-weight: 600;
      letter-spacing: .2em;
      text-transform: uppercase;
      text-shadow: 0 0 24px rgba(255, 255, 255, .16);
    }

    .rule {
      width: 650px;
      height: 8px;
      margin: 0 auto 38px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--blue), var(--violet), var(--pink));
      box-shadow: 0 0 22px rgba(162, 89, 255, .45);
    }

    .message {
      max-width: 850px;
      margin: 0 auto 38px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .message span {
      display: block;
      margin-bottom: 16px;
      color: rgba(255, 255, 255, .9);
      font-size: 38px;
      font-weight: 600;
    }

    .message strong {
      display: block;
      font-size: 62px;
      line-height: 1.08;
      font-weight: 900;
    }

    .phone {
      min-height: 138px;
      display: grid;
      grid-template-columns: 112px 1px minmax(0, 1fr);
      align-items: center;
      gap: 42px;
      border: 5px solid transparent;
      border-radius: 34px;
      padding: 18px 34px;
      background:
        linear-gradient(#0b0e14, #0b0e14) padding-box,
        linear-gradient(100deg, var(--blue), var(--violet), var(--pink)) border-box;
      box-shadow: inset 0 0 38px rgba(46, 160, 255, .08), 0 16px 44px rgba(0, 0, 0, .3);
    }

    .phone__icon {
      width: 112px;
      height: 112px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #05070b;
      background: linear-gradient(135deg, var(--blue), var(--violet), var(--pink));
      box-shadow: 0 16px 36px rgba(162, 89, 255, .3);
    }

    .phone__icon svg {
      width: 56px;
      height: 56px;
      fill: currentColor;
    }

    .phone__divider {
      width: 1px;
      height: 104px;
      background: linear-gradient(180deg, transparent, rgba(162, 89, 255, .95), transparent);
    }

    .phone strong {
      color: #fff;
      font-size: 66px;
      line-height: 1;
      font-weight: 950;
      letter-spacing: .03em;
      white-space: nowrap;
      text-shadow: 0 10px 24px rgba(0, 0, 0, .34);
    }

    .qr-panel {
      width: 100%;
      display: grid;
      grid-template-rows: auto auto;
      align-content: center;
      justify-items: center;
      gap: 20px;
      padding: 0;
      background: transparent;
      box-shadow: none;
    }

    .qr-box {
      align-self: center;
      display: grid;
      place-items: center;
      border-radius: 28px;
      padding: 24px;
      background: #fff;
      box-shadow:
        0 18px 44px rgba(0, 0, 0, .38),
        0 0 0 4px rgba(255, 255, 255, .08);
    }

    .qr-box img {
      width: 305px;
      height: 305px;
      display: block;
    }

    .qr-note {
      order: -1;
      max-width: 345px;
      margin: 0 auto;
      color: var(--muted);
      text-align: center;
      font-size: 24px;
      line-height: 1.35;
      font-weight: 800;
      text-shadow: 0 8px 18px rgba(0, 0, 0, .5);
    }

    .card--second::before,
    .card--second .phone {
      background:
        linear-gradient(#0b0e14, #0b0e14) padding-box,
        linear-gradient(100deg, var(--amber), var(--violet), var(--blue)) border-box;
    }

    .card--second .rule,
    .card--second .phone__icon {
      background: linear-gradient(135deg, var(--amber), var(--violet), var(--blue));
    }

    @media print {
      @page {
        size: A4 landscape;
        margin: 7mm;
      }

      body {
        padding: 0;
        background: white;
      }

      .sheet {
        gap: 6mm;
      }

      .card {
        width: 138mm;
        height: 74mm;
        border-radius: 5mm;
        padding: 4mm;
        page-break-inside: avoid;
        box-shadow: none;
      }

      .card::before {
        inset: 1.2mm;
        border-width: .55mm;
        border-radius: 4mm;
      }

      .card::after {
        inset: 1.2mm;
        border-radius: 4mm;
      }

      .card__inner {
        grid-template-columns: 1fr 32mm;
        gap: 4mm;
        align-items: center;
      }

      .brand {
        gap: 2.4mm;
        margin: .4mm auto 3.5mm;
      }

      .brand img {
        width: 10mm;
        height: 10mm;
      }

      .brand span {
        font-size: 7.2mm;
      }

      .rule {
        width: 55mm;
        height: .7mm;
        margin: 0 auto 3.8mm;
      }

      .message {
        margin-bottom: 4mm;
      }

      .message span {
        margin-bottom: 1.2mm;
        font-size: 3.25mm;
      }

      .message strong {
        font-size: 5.2mm;
      }

      .phone {
        min-height: 12mm;
        grid-template-columns: 10mm .2mm 1fr;
        gap: 3.2mm;
        border-width: .45mm;
        border-radius: 3mm;
        padding: 1.7mm 2.8mm;
      }

      .phone__icon {
        width: 10mm;
        height: 10mm;
      }

      .phone__icon svg {
        width: 5mm;
        height: 5mm;
      }

      .phone__divider {
        height: 9mm;
      }

      .phone strong {
        font-size: 5.4mm;
      }

      .qr-panel {
        align-content: center;
        justify-items: center;
        gap: 1.8mm;
        padding: 0;
      }

      .qr-box {
        border-radius: 2.4mm;
        padding: 1.5mm;
      }

      .qr-box img {
        width: 26mm;
        height: 26mm;
      }

      .qr-note {
        max-width: 28mm;
        font-size: 2mm;
        line-height: 1.3;
      }
    }
  </style>
</head>
<body>
  <main class="sheet">
    <article class="card" id="card-9332779343">
      <div class="card__inner">
        <section>
          <div class="brand">
            <img src="../images/logo-mark.png" alt="">
            <span>Auralith</span>
          </div>
          <div class="rule" aria-hidden="true"></div>
          <p class="message">
            <span>Если моя машина мешает</span>
            <strong>позвоните или напишите</strong>
          </p>
          <div class="phone">
            <span class="phone__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.77.63 2.61a2 2 0 0 1-.45 2.11L8.02 9.71a16 16 0 0 0 6.27 6.27l1.27-1.27a2 2 0 0 1 2.11-.45c.84.3 1.71.51 2.61.63A2 2 0 0 1 22 16.92Z"/>
              </svg>
            </span>
            <span class="phone__divider"></span>
            <strong>+7 933 277 93 43</strong>
          </div>
        </section>
        <aside class="qr-panel">
          <p class="qr-note">Отсканируйте QR-код, чтобы написать владельцу</p>
          <div class="qr-box">
            <img src="car-9332779343.png" alt="QR-код для связи с владельцем">
          </div>
        </aside>
      </div>
    </article>

    <article class="card card--second" id="card-9966566669">
      <div class="card__inner">
        <section>
          <div class="brand">
            <img src="../images/logo-mark.png" alt="">
            <span>Auralith</span>
          </div>
          <div class="rule" aria-hidden="true"></div>
          <p class="message">
            <span>Если моя машина мешает</span>
            <strong>позвоните или напишите</strong>
          </p>
          <div class="phone">
            <span class="phone__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.77.63 2.61a2 2 0 0 1-.45 2.11L8.02 9.71a16 16 0 0 0 6.27 6.27l1.27-1.27a2 2 0 0 1 2.11-.45c.84.3 1.71.51 2.61.63A2 2 0 0 1 22 16.92Z"/>
              </svg>
            </span>
            <span class="phone__divider"></span>
            <strong>+7 996 656 66 69</strong>
          </div>
        </section>
        <aside class="qr-panel">
          <p class="qr-note">Отсканируйте QR-код, чтобы написать владельцу</p>
          <div class="qr-box">
            <img src="car-9966566669.png" alt="QR-код для связи с владельцем">
          </div>
        </aside>
      </div>
    </article>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const only = params.get('only');

    if (only) {
      document.body.classList.add('single-card');
      document.querySelectorAll('.card').forEach((card) => {
        card.hidden = card.id !== `card-${only}`;
      });
    }
  </script>
</body>
</html>
